# One Render Blueprint for the live demos of the portfolio projects (free web services).
# Render > New > Blueprint, pick this repo, Apply. Each service builds from its own repo.
services:
  - type: web
    name: barsha-nepal-monsoon-lakehouse
    repo: https://github.com/bikash9cmd/monsoon-rainfall-lakehouse-nepal
    branch: main
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-app.txt && python -m barsha --lake lake run --backfill
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
  - type: web
    name: bato-trek-safety-nepal
    repo: https://github.com/bikash9cmd/trekker-safety-alerts-nepal
